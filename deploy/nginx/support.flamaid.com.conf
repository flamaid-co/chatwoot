# FlamAid · nginx server block for Chatwoot (Phase B)
# Append/include this in the flamaid host nginx config:
#   /root/flamusServer/nginx/nginx.conf  (mounted into the nginx-proxy container)
#
# Prereqs:
#   1. DNS: support.flamaid.com  A  91.98.91.232
#   2. Certbot cert issued (webroot /var/www/certbot inside the proxy):
#        docker exec nginx-proxy certbot certonly --webroot -w /var/www/certbot \
#          -d support.flamaid.com --email apps@flamaid.com --agree-tos -n
#   3. Chatwoot's rails container attached to the `supabase_default` network with
#      alias `chatwoot-rails` so this proxy can reach it by name (see DEPLOYMENT.md).

# HTTP: ACME challenge + redirect to HTTPS
server {
    listen 80;
    server_name support.flamaid.com;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }
    location / {
        return 301 https://$host$request_uri;
    }
}

# HTTPS: proxy to Chatwoot rails (port 3000)
server {
    listen 443 ssl;
    http2 on;
    server_name support.flamaid.com;

    ssl_certificate     /etc/letsencrypt/live/support.flamaid.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/support.flamaid.com/privkey.pem;

    # Allow file/attachment uploads from agents and contacts
    client_max_body_size 40M;

    location / {
        proxy_pass http://chatwoot-rails:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # WebSocket / ActionCable (live updates in the inbox)
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $http_connection;
        proxy_read_timeout 1m;
        proxy_send_timeout 1m;
    }
}
