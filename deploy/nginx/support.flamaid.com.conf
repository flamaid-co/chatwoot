# FlamAid · nginx server block for Chatwoot (Phase B) — DEPLOYED
# Appended to the flamaid host nginx template:
#   /root/flamusServer/nginx/nginx.conf  (mounted into nginx-proxy as a template)
#
# IMPORTANT host quirks discovered during deploy:
#  - nginx-proxy runs as non-root and the host maps 443 -> container 4443, so HTTPS
#    server blocks MUST `listen 4443` (NOT 443). Port 80 is direct (host 80 -> 80).
#  - The template is a FILE bind-mount. `sed -i` breaks the inode link (container
#    keeps serving the old content). Edit the host file, then sync it into the
#    running container in-place before regenerating:
#       docker exec -i nginx-proxy sh -c 'cat > /etc/nginx/templates/default.conf.template' \
#         < /root/flamusServer/nginx/nginx.conf
#       docker exec nginx-proxy /docker-entrypoint.d/20-envsubst-on-templates.sh
#       docker exec nginx-proxy nginx -t && docker exec nginx-proxy nginx -s reload
#    (A proper re-link only happens on `docker restart nginx-proxy` = brief api
#     downtime, so avoid it; the in-place sync above needs no restart.)
#  - Prereq: chatwoot rails attached to the `supabase_default` network with alias
#    `chatwoot-rails` (see docker-compose.yaml networks block).

# WebSocket upgrade map (ActionCable / live inbox)
map $http_upgrade $connection_upgrade {
    default upgrade;
    ""      close;
}

# HTTP: ACME challenge + redirect to HTTPS
server {
    listen 80;
    server_name support.flamaid.com;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }
    location / {
        return 301 https://$host$request_uri;
    }
}

# HTTPS (container port 4443 == host 443): proxy to Chatwoot rails
server {
    listen 4443 ssl;
    listen [::]:4443 ssl;
    http2 on;
    server_name support.flamaid.com;

    ssl_certificate     /etc/letsencrypt/live/support.flamaid.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/support.flamaid.com/privkey.pem;

    client_max_body_size 40M;

    location / {
        proxy_pass http://chatwoot-rails:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # WebSocket / ActionCable
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_read_timeout 1m;
        proxy_send_timeout 1m;
    }
}
